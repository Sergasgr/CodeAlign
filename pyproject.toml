[project]
name = "codealign"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.50.0",
    "cpplint>=2.0.2",
    "datasets>=5.0.0",
    "httpx>=0.28.1",
    "lizard>=1.23.0",
    "peft>=0.19.1",
    "python-dotenv>=1.2.2",
    "radon>=6.0.1",
    "ruff>=0.16.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "trl>=1.9.1",
    "wandb>=0.28.1",
]

# Optional: TRL's built-in Unsloth integration for SFT/DPO can cut training
# time roughly in half and reduce memory use substantially on a single GPU —
# worth it given the compute budget in the README. Install with:
#   uv sync --extra speed
[project.optional-dependencies]
speed = [
    "unsloth",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
