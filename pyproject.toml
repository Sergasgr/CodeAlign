[project]
name = "codealign"
version = "1.0.0"
description = "Post-training pipeline for coding LLMs — SFT + DPO with a composite (execution + static analysis) reward signal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.50.0",
    "cpplint>=2.0.2",
    "datasets>=5.0.0",
    "datasketch>=2.0.0",
    "fastapi>=0.141.1",
    "evaluate>=0.4.0",
    "gradio>=6.22.0",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "lizard>=1.23.0",
    "peft>=0.19.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "trl>=1.9.1",
    "uvicorn>=0.52.1",
    "wandb>=0.28.1",
]

# Optional: TRL's built-in Unsloth integration for SFT/DPO can cut training
# time roughly in half and reduce memory use substantially on a single GPU.
# Install with: uv sync --extra speed
[project.optional-dependencies]
speed = [
    "unsloth",
]

[dependency-groups]
dev = [
    # Evaluation harness, pinned to the commit scripts/setup_eval_harness.sh clones and patches.
    "bigcode-eval @ git+https://github.com/bigcode-project/bigcode-evaluation-harness@8fc5bae6479c4fbbb28c3f8b644f6a15b3f3b5bd",
    "jupyter>=1.1.1",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pytest>=9.1.1",
    "seaborn>=0.13.0",
]

[tool.uv]
# filelock >= 3.30 installs an audit hook that raises "os.fork is unsafe while filelock is changing
# descriptor ownership" when several threads fork at once, which is exactly how the evaluation
# harness runs the HumanEval tests (16 threads, one subprocess each).
constraint-dependencies = ["filelock<3.30"]
